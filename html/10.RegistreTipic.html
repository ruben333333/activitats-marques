<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registre</title>
</head>
<body>

  <header>
    <h1>Crea el teu compte</h1>
    <p>Omple les dades per registrar-te.</p>
  </header>

  <main>
    <form action="#" method="post">

      <p>
        <label for="nom">Nom:</label><br>
        <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">
      </p>

      <p>
        <label for="correu">Correu electrònic:</label><br>
        <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu electrònic">
      </p>

      <p>
        <label for="contrasenya">Contrasenya:</label><br>
        <input type="password" id="contrasenya" name="contrasenya" placeholder="Escriu la teva contrasenya">
      </p>

      <p>
        <input type="checkbox" id="termes" name="termes">
        <label for="termes">Accepto els termes i condicions</label>
      </p>

      <p>
        <button type="submit">Registra'm</button>
      </p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 · Exercici 10</p>
  </footer>

</body>
</html>
