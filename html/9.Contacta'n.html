<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacta'm</title>
</head>
<body>

  <header>
    <h1>Contacta'm</h1>
    <p>Omple el formulari i t'respondré tan aviat com pugui.</p>
  </header>

  <main>
    <form action="#" method="post">

      <p>
        <label for="nom">Nom:</label><br>
        <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">
      </p>

      <p>
        <label for="correu">Correu electrònic:</label><br>
        <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu electrònic">
      </p>

      <p>
        <label for="missatge">Missatge:</label><br>
        <textarea id="missatge" name="missatge" rows="6" cols="40" placeholder="Escriu aquí el teu missatge"></textarea>
      </p>

      <p>
        <button type="submit">Envia</button>
        <button type="reset">Esborra</button>
      </p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 · Exercici 9</p>
  </footer>

</body>
</html>
